<!doctype html>
<html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#082d23"><title>Karácsonyi titkos húzás</title>
<style>
:root{color-scheme:dark;--gold:#e3c16d;--cream:#fff4d7;--muted:#c8d6c9}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at top,#174b38 0,#082b22 48%,#041711 100%);font-family:system-ui,-apple-system,sans-serif;color:var(--cream);display:flex;justify-content:center;padding:24px 15px}main{width:min(100%,480px);margin:auto}.orn{color:var(--gold);text-align:center;font-size:25px;letter-spacing:8px}.card{background:linear-gradient(145deg,rgba(17,65,49,.97),rgba(7,39,30,.98));border:1px solid rgba(227,193,109,.55);border-radius:24px;padding:25px 21px;box-shadow:0 18px 55px #0007}h1{text-align:center;color:var(--gold);font-family:Georgia,serif;font-size:32px;line-height:1.15;margin:12px 0 8px}.sub{text-align:center;color:var(--muted);margin:0 0 25px}label{display:block;margin:16px 0 7px;color:var(--gold);font-weight:650}select,input{width:100%;border-radius:12px;border:1px solid #799987;background:#f8f3e5;color:#142c22;padding:14px;font-size:17px}button{width:100%;border:0;border-radius:14px;background:linear-gradient(135deg,#f1d98f,#c69b3d);color:#18271c;font-weight:800;font-size:17px;padding:15px;margin-top:20px;cursor:pointer}button:disabled{opacity:.55}.result{display:none;margin-top:20px;padding:20px;border:1px solid var(--gold);border-radius:16px;text-align:center;background:#061f19}.result small{color:var(--muted)}.recipient{display:block;color:var(--gold);font: bold 30px Georgia,serif;margin-top:8px}.error{color:#ffb4a9;min-height:24px;margin-top:12px;text-align:center}.status{border-top:1px solid #ffffff26;margin-top:23px;padding-top:17px;color:var(--muted);font-size:13px;text-align:center}.status strong{color:var(--gold)}.snow{text-align:center;color:#d9c27f;letter-spacing:12px;margin-top:18px}
</style></head><body><main><div class="orn">✦ ❄ ✦</div><section class="card"><h1>Karácsonyi titkos húzás</h1><p class="sub">Válaszd ki a neved, és add meg a saját belépőkódodat!</p>
<label for="person">A te neved</label><select id="person"><option value="">Válassz nevet…</option><option value="gaga">Gaga</option><option value="zsofi">Zsófi</option><option value="judit">Judit</option><option value="ricsi">Ricsi</option><option value="ancsi">Ancsi</option><option value="hedi">Hedi</option><option value="viki">Viki</option><option value="lili">Lili</option></select>
<label for="pin">6 számjegyű belépőkód</label><input id="pin" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="••••••" type="password"><button id="draw">🎁 Húzok!</button><div class="error" id="error" role="status"></div><div class="result" id="result"><small>Akit kihúztál:</small><span class="recipient" id="recipient"></span><small>Pszt… maradjon titok! 🤫</small></div><div class="status" id="status">A húzás állapotának betöltése…</div></section><div class="snow">✧ ✦ ❄ ✦ ✧</div></main>
<script>
const $=id=>document.getElementById(id);
const PEOPLE={gaga:'Gaga',zsofi:'Zsófi',judit:'Judit',ricsi:'Ricsi',ancsi:'Ancsi',hedi:'Hedi',viki:'Viki',lili:'Lili'};
async function refresh(){try{const r=await fetch('/.netlify/functions/huzas',{cache:'no-store'});if(!r.ok)throw new Error();const s=await r.json();$('status').innerHTML=`Még <strong>${s.remainingGivers.length}</strong> ember vár húzásra · <strong>${s.remainingRecipients.length}</strong> név maradt`;[...$('person').options].forEach(o=>{if(o.value)o.disabled=!s.remainingGivers.includes(PEOPLE[o.value]);});}catch{$('status').textContent='A húzás állapota most nem érhető el.';}}
$('draw').addEventListener('click',async()=>{$('error').textContent='';$('result').style.display='none';const name=$('person').value,pin=$('pin').value;if(!name||!/^\d{6}$/.test(pin)){$('error').textContent='Válaszd ki a neved, és írd be a 6 számjegyű kódot.';return;}$('draw').disabled=true;$('draw').textContent='Húzás folyamatban…';try{const r=await fetch('/.netlify/functions/huzas',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,pin})});const data=await r.json();if(!r.ok)throw new Error(data.error||'Hiba történt.');$('recipient').textContent=data.recipient;$('result').style.display='block';$('pin').value='';$('person').value='';await refresh();}catch(e){$('error').textContent=e.message||'Nem sikerült a húzás.';await refresh();}finally{$('draw').disabled=false;$('draw').textContent='🎁 Húzok!';}});
refresh();setInterval(refresh,12000);
</script></body></html>
